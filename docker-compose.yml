services:
  # --- Databases & Message Broker ---
  catalog-db:
    image: mongo:6.0
    container_name: catalog-db
    ports:
      - "27017:27017"
    volumes:
      - catalog_data:/data/db

  order-db:
    image: mongo:6.0
    container_name: order-db
    ports:
      - "27018:27017"
    volumes:
      - order_data:/data/db

  rating-db:
    image: mongo:6.0
    container_name: rating-db
    ports:
      - "27019:27017"
    volumes:
      - rating_data:/data/db

  notification-db:
    image: mongo:6.0
    container_name: notification-db
    ports:
      - "27020:27017"
    volumes:
      - notification_data:/data/db

  rabbitmq:
    image: rabbitmq:3-management
    container_name: cakedelight-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest

  # --- Node.js Microservices (Tagged for K8s & Compose) ---
  catalog-service:
    build: ./catalog-service
    image: cakedelight/catalog-service:latest
    container_name: catalog-service
    ports:
      - "3001:3001"
    environment:
      - PORT=3001
      - MONGO_URI=mongodb://catalog-db:27017/catalog_db
    depends_on:
      - catalog-db

  order-service:
    build: ./order-service
    image: cakedelight/order-service:latest
    container_name: order-service
    ports:
      - "3002:3002"
    environment:
      - PORT=3002
      - MONGO_URI=mongodb://order-db:27017/order_db
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672
    depends_on:
      - order-db
      - rabbitmq

  rating-service:
    build: ./rating-service
    image: cakedelight/rating-service:latest
    container_name: rating-service
    ports:
      - "3003:3003"
    environment:
      - PORT=3003
      - MONGO_URI=mongodb://rating-db:27017/rating_db
    depends_on:
      - rating-db

  notification-service:
    build: ./notification-service
    image: cakedelight/notification-service:latest
    container_name: notification-service
    ports:
      - "3004:3004"
    environment:
      - PORT=3004
      - MONGO_URI=mongodb://notification-db:27017/notification_db
      - RABBITMQ_URL=amqp://guest:guest@rabbitmq:5672
    depends_on:
      - notification-db
      - rabbitmq

  # --- API Gateway ---
  api-gateway:
    build: ./api-gateway
    image: cakedelight/api-gateway:latest
    container_name: api-gateway
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - CATALOG_SERVICE_URL=http://catalog-service:3001
      - ORDER_SERVICE_URL=http://order-service:3002
      - RATING_SERVICE_URL=http://rating-service:3003
      - NOTIFICATION_SERVICE_URL=http://notification-service:3004
    depends_on:
      - catalog-service
      - order-service
      - rating-service
      - notification-service

  # --- React Frontend ---
  frontend:
    build: ./frontend
    image: cakedelight/frontend:latest
    container_name: cakedelight-frontend
    ports:
      - "3000:3000"
    depends_on:
      - api-gateway

volumes:
  catalog_data:
  order_data:
  rating_data:
  notification_data:
