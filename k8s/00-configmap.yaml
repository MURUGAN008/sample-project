apiVersion: v1
kind: ConfigMap
metadata:
  name: cakedelight-config
data:
  CATALOG_DB_URI: "mongodb://catalog-db:27017/catalog_db"
  ORDER_DB_URI: "mongodb://order-db:27017/order_db"
  RATING_DB_URI: "mongodb://rating-db:27017/rating_db"
  NOTIFICATION_DB_URI: "mongodb://notification-db:27017/notification_db"
  RABBITMQ_URL: "amqp://guest:guest@rabbitmq-service:5672"
  CATALOG_SERVICE_URL: "http://catalog-service:3001"
  ORDER_SERVICE_URL: "http://order-service:3002"
  RATING_SERVICE_URL: "http://rating-service:3003"
  NOTIFICATION_SERVICE_URL: "http://notification-service:3004"
